description: >-
  Alert Production pipeline modified to test processing with alternate templates

imports:
  - location: $PROMPT_PROCESSING_DIR/pipelines/LSSTCam/dev/ApPipe.yaml
tasks:
  calibrateImage:
    class: lsst.pipe.tasks.calibrateImage.CalibrateImageTask
    config:
      run_sattle: False
  detectAndMeasureDiaSource:
    class: lsst.ip.diffim.detectAndMeasure.DetectAndMeasureTask
    config:
      run_sattle: False
  associateApdb:
    class: lsst.ap.association.DiaPipelineTask
    config:
      alertPackager.doProduceAlerts: False
  buildDecamTemplate:
    class: lsst.ip.diffim.getTemplate.GetTemplateTask
    config:
      connections.coaddName: parameters.coaddName
      connections.bbox: preliminary_visit_image.bbox
      connections.wcs: preliminary_visit_image.wcs
      connections.coaddExposures: template_coadd_test2
      connections.template: template_detector
